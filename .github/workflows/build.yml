name: APK bauen

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.7
      
      - name: Version bestimmen
        # Neue Versionen heißen 1.1, 1.2, 1.3 … – die nächste ist „letzte 1.x + 1“.
        # Der Tag endet auf die Build-Nummer (v1.3-build.105), damit auch ältere App-Versionen das Update finden.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST=$(gh api "repos/${{ github.repository }}/releases?per_page=100" --jq '.[].tag_name' \
            | sed -n -E 's/^v1\.([0-9]+)-build\..*/\1/p' | sort -n | tail -1)
          NEXT=$(( ${LAST:-0} + 1 ))
          echo "APP_VERSION=1.$NEXT" >> "$GITHUB_ENV"
          echo "APP_TAG=v1.$NEXT-build.${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "Version 1.$NEXT (Build ${{ github.run_number }})"

      - name: APK bauen
        run: gradle assembleRelease --no-daemon -PbuildNumber=${{ github.run_number }} -PappVersion=${{ env.APP_VERSION }} -PupdateRepo=${{ github.repository }}

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk "Musikplayer-${{ env.APP_VERSION }}.apk"

      - name: APK als Artifact speichern
        uses: actions/upload-artifact@v5
        with:
          name: Musikplayer-${{ env.APP_VERSION }}
          path: Musikplayer-${{ env.APP_VERSION }}.apk

      - name: Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_TAG }}
          name: Musikplayer ${{ env.APP_VERSION }}
          generate_release_notes: true
          files: Musikplayer-${{ env.APP_VERSION }}.apk
