name: APK bauen

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.7
      
      - name: APK bauen
        run: gradle assembleRelease --no-daemon -PbuildNumber=${{ github.run_number }} -PupdateRepo=${{ github.repository }}
      
      - name: APK umbenennen
        run: |
          VERSION="1.0.${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "Musikplayer-v${VERSION}.apk"
      
      - name: APK als Artifact speichern
        uses: actions/upload-artifact@v5
        with:
          name: Musikplayer-v${{ github.run_number }}
          path: Musikplayer-v1.0.${{ github.run_number }}.apk
      
      - name: Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Musikplayer v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: Musikplayer-v1.0.${{ github.run_number }}.apk
